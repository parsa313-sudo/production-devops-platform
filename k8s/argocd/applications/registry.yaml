apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: registry
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/parsa313-sudo/production-devops-platform.git
    targetRevision: main
    path: k8s/apps/registry

  destination:
    server: https://kubernetes.default.svc
    namespace: registry

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
