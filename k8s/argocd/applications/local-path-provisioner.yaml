apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path-provisioner
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/rancher/local-path-provisioner.git
    targetRevision: v0.0.37
    path: deploy/chart/local-path-provisioner

    helm:
      releaseName: local-path-provisioner

      valuesObject:
        image:
          repository: registry.devops.internal:30500/rancher/local-path-provisioner
          tag: v0.0.37
          pullPolicy: IfNotPresent

        helperImage:
          repository: registry.devops.internal:30500/library/busybox
          tag: "1.37.0"

        storageClassConfigs:
          local-pg:
            storageClass:
              create: true
              defaultClass: false
              defaultVolumeType: local
              reclaimPolicy: Retain
              volumeBindingMode: WaitForFirstConsumer

            nodePathMap:
              - node: k8s-worker-01
                paths:
                  - /var/lib/local-path-provisioner

              - node: k8s-worker-02
                paths:
                  - /var/lib/local-path-provisioner

              - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
                paths: []

          local-redis:
            storageClass:
              create: true
              defaultClass: false
              defaultVolumeType: local
              reclaimPolicy: Retain
              volumeBindingMode: WaitForFirstConsumer

            nodePathMap:
              - node: k8s-worker-01
                paths:
                  - /var/lib/local-path-provisioner/redis

              - node: k8s-worker-02
                paths:
                  - /var/lib/local-path-provisioner/redis

              - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
                paths: []

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi

        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - k8s-worker-02

  destination:
    server: https://kubernetes.default.svc
    namespace: local-path-storage

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
