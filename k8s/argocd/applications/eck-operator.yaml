apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eck-operator
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/elastic/cloud-on-k8s.git
    targetRevision: v3.5.0
    path: deploy/eck-operator

    helm:
      releaseName: elastic-operator

      valuesObject:
        installCRDs: true

        image:
          repository: registry.devops.internal:30500/eck/eck-operator
          tag: "3.5.0"
          pullPolicy: IfNotPresent

        resources:
          requests:
            cpu: 100m
            memory: 150Mi
          limits:
            cpu: 500m
            memory: 512Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: elastic-system

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
