apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-smoke
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/parsa313-sudo/production-devops-platform.git
    targetRevision: main
    path: k8s/apps/gitops-smoke

  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-smoke

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
