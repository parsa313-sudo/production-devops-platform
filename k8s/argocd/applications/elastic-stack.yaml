apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elastic-stack
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/parsa313-sudo/production-devops-platform.git
    targetRevision: main
    path: k8s/logging/elastic-stack

  destination:
    server: https://kubernetes.default.svc
    namespace: logging

  ignoreDifferences:
    - group: logstash.k8s.elastic.co
      kind: Logstash
      name: logstash
      namespace: logging
      jsonPointers:
        - /spec/podTemplate/spec/containers/0/resources
        - /spec/services/0/service/metadata
        - /spec/services/0/tls
        - /spec/volumeClaimTemplates/0/status
    ignoreDifferences:
    - group: logstash.k8s.elastic.co
      kind: Logstash
      name: logstash
      namespace: logging
      jsonPointers:
        - /spec/podTemplate/spec/containers/0/resources
        - /spec/services/0/service/metadata
        - /spec/services/0/tls
        - /spec/volumeClaimTemplates/0/status

    syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
