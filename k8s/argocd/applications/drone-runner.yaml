apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: drone-runner
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/drone/charts.git
    targetRevision: 5a2ed941f8987c5955f6b8e64f10f9a3b7b65cf9
    path: charts/drone-runner-docker

    helm:
      releaseName: drone-runner

      valuesObject:
        replicaCount: 1

        image:
          registry: docker.io
          repository: drone/drone-runner-docker
          tag: 1.8.5
          pullPolicy: IfNotPresent

        extraVolumes:
          - name: storage
            emptyDir: {}

          - name: devops-root-ca
            configMap:
              name: devops-root-ca
        dind:
          registry: docker.io
          repository: docker
          tag: 25-dind
          pullPolicy: IfNotPresent

          command:
            - dockerd

          commandArgs:
            - --host
            - tcp://localhost:2375
            - --insecure-registry=registry.devops.internal:30500
            - --insecure-registry=registry.registry.svc.cluster.local:5000

          securityContext:
            privileged: true

          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi

          extraVolumeMounts:
            - name: storage
              mountPath: /var/lib/docker
              subPath: docker

            - name: devops-root-ca
              mountPath: /drone-ca/devops-root-ca.crt
              subPath: devops-root-ca.crt
              readOnly: true
        gc:
          enabled: true

        extraSecretNamesForEnvFrom:
          - drone-runner-secrets

        env:
          DRONE_RPC_HOST: drone:8080
          DRONE_RPC_PROTO: http
          DRONE_RUNNER_CAPACITY: "1"
          DRONE_RUNNER_VOLUMES: "/drone-ca/devops-root-ca.crt:/etc/ssl/certs/devops-root-ca.crt"
          DRONE_RUNNER_ENVIRON: "GIT_SSL_CAINFO:/etc/ssl/certs/devops-root-ca.crt"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - k8s-worker-01
                        - k8s-worker-02

        autoscaling:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: drone

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
