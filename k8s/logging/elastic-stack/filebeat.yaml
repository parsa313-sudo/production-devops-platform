apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: logging

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat

rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - pods
      - nodes
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat

subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: logging

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: filebeat

---
apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: filebeat
  namespace: logging

spec:
  type: filebeat
  version: 9.5.5

  image: registry.devops.internal:30500/elastic/filebeat:9.5.5

  config:
    filebeat:
      autodiscover:
        providers:
          - type: kubernetes
            node: ${NODE_NAME}

            hints:
              enabled: true

              default_config:
                type: filestream

                id: kubernetes-container-logs-${data.kubernetes.pod.name}-${data.kubernetes.container.id}

                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log

                parsers:
                  - container: {}

                prospector:
                  scanner:
                    fingerprint.enabled: true
                    symlinks: true

                file_identity.fingerprint: {}

    processors:
      - add_kubernetes_metadata: {}

      - add_host_metadata: {}

    output.logstash:
      hosts:
        - logstash-ls-beats.logging.svc:5044

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

  daemonSet:
    podTemplate:
      spec:
        serviceAccountName: filebeat
        automountServiceAccountToken: true

        terminationGracePeriodSeconds: 30

        dnsPolicy: ClusterFirstWithHostNet
        hostNetwork: true

        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule

        containers:
          - name: filebeat

            securityContext:
              runAsUser: 0

            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName

            volumeMounts:
              - name: varlogcontainers
                mountPath: /var/log/containers
                readOnly: true

              - name: varlogpods
                mountPath: /var/log/pods
                readOnly: true

              - name: beat-data
                mountPath: /usr/share/filebeat/data

        volumes:
          - name: varlogcontainers
            hostPath:
              path: /var/log/containers

          - name: varlogpods
            hostPath:
              path: /var/log/pods

          - name: beat-data
            hostPath:
              path: /var/lib/filebeat-data
              type: DirectoryOrCreate
