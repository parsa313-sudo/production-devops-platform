apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana
  namespace: logging

spec:
  version: 9.5.5

  image: registry.devops.internal:30500/elastic/kibana:9.5.5

  count: 1

  elasticsearchRef:
    name: elasticsearch

  podTemplate:
    spec:
      containers:
        - name: kibana
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
