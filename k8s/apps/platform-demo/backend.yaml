apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-demo-backend
  namespace: platform-demo
spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: platform-demo-backend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-demo-backend

    spec:
      containers:
        - name: backend
          image: registry.devops.internal:30500/platform-demo-backend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8000
              name: http

          envFrom:
            - secretRef:
                name: platform-demo-secrets

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: platform-demo-backend
  namespace: platform-demo
spec:
  selector:
    app.kubernetes.io/name: platform-demo-backend

  ports:
    - name: http
      port: 8000
      targetPort: http

  type: ClusterIP
