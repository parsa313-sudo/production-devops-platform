apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-demo-frontend
  namespace: platform-demo
spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: platform-demo-frontend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-demo-frontend

    spec:
      containers:
        - name: frontend
          image: registry.devops.internal:30500/platform-demo-frontend:7526fbcbacf47e1708844f3e91d559396b0e77b7
          imagePullPolicy: Always

          ports:
            - containerPort: 80
              name: http

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: platform-demo-frontend
  namespace: platform-demo
spec:
  selector:
    app.kubernetes.io/name: platform-demo-frontend

  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30032

  type: NodePort
