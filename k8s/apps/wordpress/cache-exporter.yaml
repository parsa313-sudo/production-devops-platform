apiVersion: v1
kind: ConfigMap
metadata:
  name: wordpress-nginx-cache-exporter
  namespace: wordpress

data:
  exporter.py: |
    import os
    import time
    import threading
    from http.server import BaseHTTPRequestHandler, HTTPServer

    LOG_FILE = "/var/cache/nginx/cache_status.log"

    statuses = [
        "HIT",
        "MISS",
        "BYPASS",
        "EXPIRED",
        "STALE",
        "UPDATING",
        "REVALIDATED",
        "OTHER",
    ]

    counters = {status: 0 for status in statuses}
    lock = threading.Lock()

    def read_log():
        while not os.path.exists(LOG_FILE):
            time.sleep(1)

        with open(LOG_FILE, "r") as log:
            while True:
                line = log.readline()

                if not line:
                    time.sleep(0.2)
                    continue

                status = line.strip()

                if status not in counters:
                    status = "OTHER"

                with lock:
                    counters[status] += 1

    class Handler(BaseHTTPRequestHandler):

        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")
                return

            if self.path != "/metrics":
                self.send_response(404)
                self.end_headers()
                return

            lines = [
                "# HELP nginx_cache_requests_total Nginx proxy cache requests by status",
                "# TYPE nginx_cache_requests_total counter",
            ]

            with lock:
                for status, value in counters.items():
                    lines.append(
                        f'nginx_cache_requests_total{{status="{status}"}} {value}'
                    )

            body = ("\n".join(lines) + "\n").encode()

            self.send_response(200)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, format, *args):
            return

    threading.Thread(target=read_log, daemon=True).start()

    HTTPServer(("0.0.0.0", 9114), Handler).serve_forever()
