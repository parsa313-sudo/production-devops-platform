apiVersion: v1
kind: Service
metadata:
  name: wordpress-nginx
  namespace: wordpress
spec:
  type: NodePort
  selector:
    app: wordpress-nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30033

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-nginx
  namespace: wordpress
spec:
  replicas: 2

  selector:
    matchLabels:
      app: wordpress-nginx

  template:
    metadata:
      labels:
        app: wordpress-nginx

    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80
              name: http

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

            - name: nginx-cache
              mountPath: /var/cache/nginx

          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2

          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: nginx-config
          configMap:
            name: wordpress-nginx-config

        - name: nginx-cache
          emptyDir: {}
