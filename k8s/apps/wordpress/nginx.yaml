apiVersion: v1
kind: Service
metadata:
  name: wordpress-nginx
  namespace: wordpress
  labels:
    app: wordpress-nginx

spec:
  type: NodePort
  selector:
    app: wordpress-nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30033
    - name: metrics
      port: 9113
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-nginx
  namespace: wordpress
spec:
  replicas: 2

  selector:
    matchLabels:
      app: wordpress-nginx

  template:
    metadata:
      labels:
        app: wordpress-nginx

    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent

        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.5.3
          imagePullPolicy: IfNotPresent

          args:
            - --nginx.scrape-uri=http://127.0.0.1:8080/stub_status

          ports:
            - name: metrics
              containerPort: 9113

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          ports:
            - containerPort: 80
              name: http

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

            - name: nginx-cache
              mountPath: /var/cache/nginx

          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2

          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: nginx-config
          configMap:
            name: wordpress-nginx-config

        - name: nginx-cache
          emptyDir: {}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: wordpress-nginx
  namespace: wordpress

spec:
  selector:
    matchLabels:
      app: wordpress-nginx

  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
