apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: platform-demo
  namespace: database
spec:
  cluster:
    name: postgres-cluster
  name: platform_demo
  login: true
  superuser: false
  createdb: false
  createrole: false
  inherit: true
  connectionLimit: 30
  databaseRoleReclaimPolicy: retain
  passwordSecret:
    name: platform-demo-db-auth
