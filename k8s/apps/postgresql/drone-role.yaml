apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: drone
  namespace: database
spec:
  cluster:
    name: postgres-cluster
  name: drone
  login: true
  superuser: false
  createdb: false
  createrole: false
  inherit: true
  connectionLimit: 50
  databaseRoleReclaimPolicy: retain
  passwordSecret:
    name: drone-db-auth
