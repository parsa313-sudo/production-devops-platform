apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: gitea
  namespace: database

spec:
  cluster:
    name: postgres-cluster

  name: gitea
  login: true
  superuser: false
  createdb: false
  createrole: false
  inherit: true
  connectionLimit: 50

  databaseRoleReclaimPolicy: retain

  passwordSecret:
    name: gitea-db-auth
