apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-cluster-ingress
  namespace: database

spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres-cluster

  policyTypes:
    - Ingress

  ingress:
    # PostgreSQL replication between instances
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres-cluster
      ports:
        - protocol: TCP
          port: 5432

    # CloudNativePG operator management
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 5432

    # Gitea application access
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gitea
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gitea
      ports:
        - protocol: TCP
          port: 5432
    # Drone CI server access
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: drone
          podSelector:
            matchLabels:
              app.kubernetes.io/name: drone
              app.kubernetes.io/component: server
      ports:
        - protocol: TCP
          port: 5432
