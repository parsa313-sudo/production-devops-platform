apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: registry

  template:
    metadata:
      labels:
        app: registry

    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k8s-worker-02

      containers:
        - name: registry
          image: ghcr.io/distribution/distribution:3.1.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: registry
              containerPort: 5000
              protocol: TCP

          env:
            - name: REGISTRY_HTTP_ADDR
              value: "0.0.0.0:5000"

            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: "/var/lib/registry"

            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /v2/
              port: registry
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /v2/
              port: registry
            initialDelaySeconds: 15
            periodSeconds: 20

          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry

      volumes:
        - name: registry-data
          persistentVolumeClaim:
            claimName: registry-data
