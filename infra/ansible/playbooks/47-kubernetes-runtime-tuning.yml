---
- name: Apply Kubernetes runtime tuning required by monitoring
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Increase Argo CD application-controller resources
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - argocd
          - set
          - resources
          - statefulset
          - argocd-application-controller
          - -c
          - application-controller
          - --requests=cpu=100m,memory=512Mi
          - --limits=cpu=500m,memory=1Gi
      register: argocd_resources
      changed_when: "'updated' in argocd_resources.stdout"

    - name: Increase Argo CD application-controller shared memory
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - argocd
          - patch
          - statefulset
          - argocd-application-controller
          - --type=strategic
          - -p
          - >-
            {"spec":{"template":{"spec":{"volumes":[{"name":"argocd-shm","emptyDir":{"medium":"Memory","sizeLimit":"256Mi"}}],"containers":[{"name":"application-controller","volumeMounts":[{"name":"argocd-shm","mountPath":"/dev/shm"}]}]}}}}
      register: argocd_shm
      changed_when: "'no change' not in argocd_shm.stdout"

    - name: Read kube-proxy configuration
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - kube-system
          - get
          - configmap
          - kube-proxy
          - -o
          - 'jsonpath={.data.config\.conf}'
      register: kube_proxy_config
      changed_when: false

    - name: Expose kube-proxy metrics to Prometheus
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - kube-system
          - patch
          - configmap
          - kube-proxy
          - --type=merge
          - -p
          - >-
            {"data":{"config.conf":{{ kube_proxy_config.stdout
            | replace(
                'metricsBindAddress: 127.0.0.1:10249',
                'metricsBindAddress: 0.0.0.0:10249'
              )
            | to_json }}}}
      when: "'metricsBindAddress: 127.0.0.1:10249' in kube_proxy_config.stdout"
      notify: Restart kube-proxy

  handlers:
    - name: Restart kube-proxy
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - kube-system
          - rollout
          - restart
          - daemonset
          - kube-proxy
