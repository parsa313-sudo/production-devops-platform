---
- name: Bootstrap DevOps servers
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Ensure hostname resolves locally
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1'
        line: "127.0.1.1 {{ inventory_hostname }}"
        state: present

    - name: Create devops user
      ansible.builtin.user:
        name: devops
        shell: /bin/bash
        groups: sudo
        append: true
        create_home: true

    - name: Add SSH public key for devops user
      ansible.posix.authorized_key:
        user: devops
        state: present
        key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/id_ed25519.pub') }}"

    - name: Allow devops user passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/devops
        content: "devops ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "/usr/sbin/visudo -cf %s"
