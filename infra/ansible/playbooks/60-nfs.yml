---
- name: Configure NFS server
  hosts: infra
  become: true
  gather_facts: true

  tasks:
    - name: Install NFS server
      ansible.builtin.apt:
        name: nfs-kernel-server
        state: present
        update_cache: true

    - name: Ensure NFS exports directory exists
      ansible.builtin.file:
        path: /etc/exports.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create Kubernetes NFS export directory
      ansible.builtin.file:
        path: /srv/nfs/k8s
        state: directory
        owner: nobody
        group: nogroup
        mode: "0777"

    - name: Configure Kubernetes NFS export
      ansible.builtin.copy:
        dest: /etc/exports.d/kubernetes.exports
        owner: root
        group: root
        mode: "0644"
        content: |
          /srv/nfs/k8s 10.50.0.0/24(rw,sync,no_subtree_check,root_squash)
      notify:
        - Reload NFS exports

    - name: Ensure NFS server is enabled and running
      ansible.builtin.systemd:
        name: nfs-kernel-server
        enabled: true
        state: started

    - name: Allow NFSv4 over WireGuard
      community.general.ufw:
        rule: allow
        interface_in: wg0
        src: 10.50.0.0/24
        port: "2049"
        proto: tcp

  handlers:
    - name: Reload NFS exports
      ansible.builtin.command:
        cmd: exportfs -ra
      changed_when: true


- name: Configure Kubernetes NFS clients
  hosts: k8s_cluster
  become: true
  gather_facts: false

  tasks:
    - name: Install NFS client utilities
      ansible.builtin.apt:
        name: nfs-common
        state: present
        update_cache: true
