---
- name: Install node exporter on infrastructure hosts
  hosts: infra
  become: true
  gather_facts: false

  vars:
    node_exporter_version: "1.9.1"
    node_exporter_archive: "node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    node_exporter_directory: "node_exporter-{{ node_exporter_version }}.linux-amd64"

  tasks:
    - name: Create node exporter system user
      ansible.builtin.user:
        name: node_exporter
        system: true
        create_home: false
        shell: /usr/sbin/nologin

    - name: Download node exporter
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/{{ node_exporter_archive }}"
        dest: "/tmp/{{ node_exporter_archive }}"
        mode: "0644"

    - name: Extract node exporter
      ansible.builtin.unarchive:
        src: "/tmp/{{ node_exporter_archive }}"
        dest: /tmp
        remote_src: true
        creates: "/tmp/{{ node_exporter_directory }}/node_exporter"

    - name: Install node exporter binary
      ansible.builtin.copy:
        src: "/tmp/{{ node_exporter_directory }}/node_exporter"
        dest: /usr/local/bin/node_exporter
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      notify: Restart node exporter

    - name: Install node exporter systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network-online.target
          Wants=network-online.target

          [Service]
          User=node_exporter
          Group=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Restart node exporter

    - name: Enable and start node exporter
      ansible.builtin.systemd:
        name: node_exporter
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart node exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: restarted
