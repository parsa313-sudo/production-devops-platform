---
- name: Configure private split DNS on Kubernetes nodes
  hosts: k8s_cluster
  become: true
  gather_facts: false

  vars:
    private_dns_server: 10.50.0.1
    private_dns_domain: devops.internal

  tasks:
    - name: Ensure systemd-resolved drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Remove old private DNS drop-in
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d/devops-internal.conf
        state: absent

    - name: Configure private split DNS
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/99-devops-internal.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Resolve]
          DNS={{ private_dns_server }}
          Domains=~{{ private_dns_domain }}
          DNSStubListener=yes
      notify: Restart systemd-resolved

    - name: Ensure systemd-resolved is enabled and running
      ansible.builtin.systemd:
        name: systemd-resolved
        enabled: true
        state: started

    - name: Apply DNS changes now
      ansible.builtin.meta: flush_handlers

    - name: Verify systemd-resolved stub exists
      ansible.builtin.stat:
        path: /run/systemd/resolve/stub-resolv.conf
      register: resolved_stub

    - name: Fail if systemd-resolved stub is unavailable
      ansible.builtin.assert:
        that:
          - resolved_stub.stat.exists
        fail_msg: "systemd-resolved stub resolv.conf does not exist"

    - name: Use systemd-resolved stub as host resolver
      ansible.builtin.file:
        src: /run/systemd/resolve/stub-resolv.conf
        dest: /etc/resolv.conf
        state: link
        force: true

  handlers:
    - name: Restart systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
