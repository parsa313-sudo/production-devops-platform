---
- name: Configure kube-proxy metrics for Prometheus
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Read kube-proxy configuration
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - kube-system
          - get
          - configmap
          - kube-proxy
          - -o
          - 'jsonpath={.data.config\.conf}'
      register: kube_proxy_config
      changed_when: false

    - name: Expose kube-proxy metrics to Prometheus
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - kube-system
          - patch
          - configmap
          - kube-proxy
          - --type=merge
          - -p
          - >-
            {"data":{"config.conf":{{ kube_proxy_config.stdout
            | replace(
                'metricsBindAddress: 127.0.0.1:10249',
                'metricsBindAddress: 0.0.0.0:10249'
              )
            | to_json }}}}
      when: "'metricsBindAddress: 127.0.0.1:10249' in kube_proxy_config.stdout"
      notify: Restart kube-proxy

  handlers:
    - name: Restart kube-proxy
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - kube-system
          - rollout
          - restart
          - daemonset
          - kube-proxy
